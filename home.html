
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <title>Homepage</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            background: #eaf2ff;
            color: #26344a;
        }

        .navbar .nav-link {
        color: black !important;
    }

    .navbar .nav-link:hover {
        color: #333 !important;
    }

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 35px 20px;
        }

        .card {
            width: 100%;
            max-width: 460px;
        }

        form {
            padding: 35px;
            background-color: white;
            color: #26344a;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
            border: 1px solid #d5e3f7;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header .symbol {
            width: 80px;
            height: 75px;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #2457a6;
            color: white;
            border-radius: 50%;
            font-size: 30px;
            font-weight: bold;
        }

        .header h1 {
            font-size: 25px;
            margin: 0 0 12px;
            color: #2457a6;
        }

        .header p {
            color: #66758a;
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
        }

        .inputs {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
            color: #26344a;
        }

        input[type="text"] {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #cbd8eb;
            border-radius: 8px;
            background-color: white;
            color: #26344a;
            font-size: 14px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #3978d4;
            background-color: white;
            box-shadow: 0 0 5px rgba(57, 120, 212, 0.2);
        }

        input::placeholder {
            color: #9ba5b4;
        }

        .footer button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: #2457a6;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .footer button:hover {
            background-color: #17427f;
        }

        .result {
            margin-top: 18px;
            padding: 16px;
            border-radius: 12px;
            background-color: white;
            color: #26344a;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid #d5e3f7;
        }

        footer {
            padding: 15px;
            background-color: white;
            color: #66758a;
            text-align: center;
            font-size: 12px;
            letter-spacing: 1px;
            border-top: 1px solid #d5e3f7;
        }

        @media (max-width: 500px) {
            form {
                padding: 25px 20px;
            }

            .header h1 {
                font-size: 22px;
            }

            nav {
                padding: 16px 20px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-light"
     style="background-color: #ffffff;">

    <div class="container-fluid">

        <a class="navbar-brand" href="#"></a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mynavbar">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <h5><a class="nav-link" href="#">Home</a></h5>
                </li>

                <li class="nav-item">
                    <h5><a class="nav-link" href="#">Fares</a></h5>
                </li>

                <li class="nav-item">
                    <h5><a class="nav-link" href="#">Schedule</a></h5>
                </li>

                <li class="nav-item">
                    <h5><a class="nav-link" href="#">Help</a></h5>
                </li>

            </ul>

            <form class="d-flex">
                <input class="form-control me-2" type="text" placeholder="Search">
                <button class="btn btn-primary" type="button">Search</button>
            </form>

        </div>
    </div>
</nav>

    <div class="container">
        <div class="card">

            <form>
                <div class="header">
                    <h1>Application Status</h1>

                    <p>
                        Welcome to the Ram University!
                    </p>
                </div>

                <div class="inputs">
                    <label for="firstname">First Name</label>
                    <input
                        type="text"
                        id="firstname"
                        placeholder="Enter your first name"
                    >

                    <label for="lastname">Last Name</label>
                    <input
                        type="text"
                        id="lastname"
                        placeholder="Enter your last name"
                    >
                </div>

                <div class="footer">
                    <button type="button" id="loginBTN" py-click="verify">
                        Check Application
                    </button>
                </div>
            </form>

            <div id="result" class="result">
                Please enter your First and Last name.
            </div>

        </div>
    </div>

    <script type="py" src="home.py"></script>

</body>
</html>
